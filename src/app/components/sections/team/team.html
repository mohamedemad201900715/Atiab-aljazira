<section id="team" aria-labelledby="team-heading" class="mx-auto max-w-7xl px-6 py-20 lg:px-8">
  <div class="mb-12 text-center">
    <p class="text-sm font-semibold uppercase tracking-[0.18em] text-cyan-300">{{ 'team.tag' | t }}</p>
    <h2 id="team-heading" class="mt-3 text-3xl font-extrabold text-white sm:text-4xl">{{ 'team.title' | t }}</h2>
  </div>

  <div class="grid gap-7 md:grid-cols-2 xl:grid-cols-3">
    @for (member of ('team.members' | t); track member.name) {
      <article class="group relative overflow-hidden rounded-3xl border border-white/10 bg-white/5 shadow-xl shadow-slate-900/40">
        <img [src]="member.image" [alt]="member.name + ' - ' + member.role" width="600" height="800" class="h-96 w-full object-cover transition duration-500 group-hover:scale-105" loading="lazy" decoding="async" />
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/30 to-transparent"></div>
        <div class="absolute inset-x-0 bottom-0 p-6">
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-cyan-300">{{ member.role }}</p>
          <h3 class="mt-1 text-xl font-bold text-white">{{ member.name }}</h3>
          <p class="mt-3 text-sm leading-relaxed text-slate-200 opacity-90 transition duration-300 group-hover:opacity-100">
            {{ member.bio }}
          </p>
          <div class="mt-4 flex gap-3 opacity-0 transition duration-300 group-hover:opacity-100">
            <span class="rounded-full border border-cyan-300/50 px-3 py-1 text-xs text-cyan-200">{{ 'team.socialLinkedIn' | t }}</span>
            <span class="rounded-full border border-cyan-300/50 px-3 py-1 text-xs text-cyan-200">{{ 'team.socialEmail' | t }}</span>
          </div>
        </div>
      </article>
    }
  </div>
</section>
