<section id="gallery" aria-labelledby="gallery-heading" class="bg-slate-900/50 py-20">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <div class="mb-12 text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.18em] text-cyan-300">{{ 'gallery.tag' | t }}</p>
      <h2 id="gallery-heading" class="mt-3 text-3xl font-extrabold text-white sm:text-4xl">{{ 'gallery.title' | t }}</h2>
    </div>

    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
      @for (image of shipmentImages; track image) {
        <a [href]="image" target="_blank" rel="noopener" class="group overflow-hidden rounded-2xl border border-white/10">
          <img
            [src]="image"
            [alt]="'gallery.imageAlt' | t"
            width="800"
            height="600"
            class="h-64 w-full object-cover transition duration-500 group-hover:scale-110"
            loading="lazy"
            decoding="async"
          />
        </a>
      }
    </div>
  </div>
</section>
