<section id="services" aria-labelledby="services-heading" class="bg-slate-900/50 py-20">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <div class="mb-12 text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.18em] text-cyan-300">{{ 'services.tag' | t }}</p>
      <h2 id="services-heading" class="mt-3 text-3xl font-extrabold text-white sm:text-4xl">{{ 'services.title' | t }}</h2>
    </div>

    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (service of ('services.items' | t); track service.title) {
        <article class="group rounded-3xl border border-white/10 bg-white/5 p-8 shadow-lg shadow-slate-950/40 transition duration-300 hover:-translate-y-1 hover:border-cyan-300/40 hover:shadow-cyan-500/20">
          <p class="mb-5 text-3xl" aria-hidden="true">{{ service.icon }}</p>
          <h3 class="text-xl font-bold text-white">{{ service.title }}</h3>
          <p class="mt-3 leading-relaxed text-slate-300">{{ service.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
